<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SpecKit</title>
  <desc id="desc">把网站的实际样式变成可追溯、可复用的设计文件。网页样本经过设计数据模型，导出文档、样式与本地预览。</desc>
  <rect width="1200" height="420" rx="20" fill="#F7F5F0"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g id="identity">
      <text x="56" y="57" fill="#69727D" font-size="19" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">WEBSITE → DESIGN REFERENCE</text>
      <text x="56" y="157" fill="#18212B" font-size="76" font-weight="650" letter-spacing="-3"><tspan fill="#7653EA">Spec</tspan>Kit</text>
      <text x="58" y="213" fill="#18212B" font-size="30" font-weight="500">把网站的实际样式，变成可复用的设计文件。</text>
    </g>
    <g id="sample-to-file" transform="translate(56 272)">
      <rect x="0" y="0" width="194" height="96" rx="12" fill="#FFFFFF"/>
      <path d="M-8 18V-8H18M176-8H202V18M202 78V104H176M18 104H-8V78" fill="none" stroke="#7653EA" stroke-width="2"/>
      <text x="20" y="43" fill="#18212B" font-size="35" font-weight="600">Aa</text>
      <rect x="21" y="60" width="44" height="15" rx="4" fill="#18212B"/>
      <rect x="72" y="60" width="44" height="15" rx="4" fill="#7653EA"/>
      <rect x="123" y="60" width="44" height="15" rx="4" fill="#B8A4F2"/>
      <path d="M218 48H266M257 40L266 48L257 56" fill="none" stroke="#9B96A8" stroke-width="2"/>
      <rect x="290" y="16" width="244" height="64" rx="12" fill="#EEE8FC"/>
      <text x="312" y="57" fill="#5938C3" font-size="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">design.json</text>
      <path d="M556 48H604M595 40L604 48L595 56" fill="none" stroke="#9B96A8" stroke-width="2"/>
      <text x="632" y="40" fill="#18212B" font-size="26" font-weight="550">文档 · 样式 · 预览</text>
      <text x="632" y="73" fill="#69727D" font-size="21">同一份数据，保留来源依据。</text>

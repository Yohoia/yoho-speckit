<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Website Style Reference</title>
<style>
__PREVIEW_CSS__
</style>
<header><div class="brand"><img class="avatar" src="__PREVIEW_AVATAR_DATA_URL__" alt="Yohoia avatar"><span class="owner">Yohoia<span class="ui-badge">Design</span></span><span class="header-divider" aria-hidden="true"></span><span class="site" id="site-title"><b id="breadcrumb"></b></span></div></header>
<nav class="mobile-tabs" role="tablist" aria-label="移动端展示"><button id="show-preview" role="tab" aria-controls="reference-panel" aria-selected="true">Preview</button><button id="mobile-design" role="tab" aria-controls="code" data-mobile-format="DESIGN.md" aria-selected="false">DESIGN.md</button><button id="mobile-tailwind" role="tab" aria-controls="code" data-mobile-format="tailwind.css" aria-selected="false">Tailwind v4</button><button id="mobile-css" role="tab" aria-controls="code" data-mobile-format="tokens.css" aria-selected="false">CSS Variables</button><button id="mobile-tokens" role="tab" aria-controls="code" data-mobile-format="design-tokens.json" aria-selected="false">Design Tokens</button></nav>
<main>
<article class="reference" id="reference-panel">
<section class="ref-section">
  <div class="hero-copy">
    <div class="title-row"><h1 id="site-name"></h1><a id="source" class="source-link" target="_blank" rel="noopener noreferrer"><span id="source-label"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a></div>
    <p id="tagline" class="intro"></p>
    <p id="overview" class="intro"></p>
  </div>
</section>
<section class="ref-section"><h2 class="ref-h2">Color Palette</h2><div id="palette" class="group-stack"></div></section>
<section class="ref-section"><h2 class="ref-h2">Typography</h2>
  <div class="type-head"><p class="eyebrow">Type Scale</p><p class="eyebrow" id="type-scale-note">Sampled combinations</p></div>
  <div id="type-scale" class="type-scale"></div>
  <div style="height:24px"></div><p class="eyebrow">Fonts</p><div id="fonts" class="font-list"></div>
</section>
<section class="ref-section"><h2 class="ref-h2">Spacing &amp; Shape</h2><div class="metric-stack">
  <div><p class="eyebrow">Spacing</p><div class="panel"><table class="data-table"><thead><tr><th>Purpose</th><th>Value</th><th>Preview</th></tr></thead><tbody id="spacing"></tbody></table></div></div>
  <div><p class="eyebrow">Border Radius</p><div class="panel"><table class="data-table"><thead><tr><th>Element</th><th>Value</th><th>Preview</th></tr></thead><tbody id="radius"></tbody></table></div></div>
  <div><p class="eyebrow">Elevation</p><div id="shadow" class="elevation-grid"></div></div>
</div></section>
<section class="ref-section"><h2 class="ref-h2">Guidelines</h2><div class="guidelines">
  <div class="guideline-group"><p class="eyebrow">Do</p><ul id="do"></ul></div>
  <div class="guideline-group"><p class="eyebrow">Don't</p><ul id="dont"></ul></div>
</div></section>
</article>
<aside class="exports" aria-label="文件导出">
<div class="tabs" role="tablist" aria-label="导出格式"><button role="tab" id="tab-design" aria-controls="code" aria-selected="true" data-format="DESIGN.md">DESIGN.md</button><button role="tab" id="tab-tailwind" aria-controls="code" aria-selected="false" data-format="tailwind.css">Tailwind v4</button><button role="tab" id="tab-css" aria-controls="code" aria-selected="false" data-format="tokens.css">CSS Variables</button><button role="tab" id="tab-tokens" aria-controls="code" aria-selected="false" data-format="design-tokens.json">Design Tokens</button></div>
<div class="toolbar"><button id="compact">Compact</button><button id="extended" class="active">Extended</button><span class="spacer"></span><button id="copy">Copy</button><button id="download">Download</button></div>
<pre id="code" class="code" role="tabpanel" aria-labelledby="tab-design" tabindex="0"></pre>
</aside>
</main><div id="toast" role="status" class="toast hidden"></div>
<script id="payload" type="application/json">__PAYLOAD__</script>
